name: Frames pluie AROME-PI

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Lire le run deja publie sur la branche data
        id: prev
        run: |
          RUN=$(git fetch -q origin data && git show FETCH_HEAD:manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).run))" || echo "")
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - run: npm install --no-save geotiff pngjs
      - run: npm run data
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          PREV_RUN: ${{ steps.prev.outputs.run }}
      - name: Publier la branche data
        if: ${{ hashFiles('out/manifest.json') != '' }}
        run: |
          cd out
          git init -q -b data
          git add -A
          git -c user.name=pleutpas-data -c user.email=163107032+jlzdev@users.noreply.github.com commit -q -m "frames $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
