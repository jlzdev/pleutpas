name: Frames pluie PIAF

# cadence nominale assuree par le declencheur externe (cron-job.org -> workflow_dispatch),
# le cron GitHub ci-dessous n'est qu'un filet de secours (scheduler erratique) garde a la
# cadence produit de 5 min, contrairement a data.yml (produit horaire, secours espace)
on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: piaf
  cancel-in-progress: false

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Lire le run deja publie sur la branche piaf
        id: prev
        run: |
          RUN=$(git fetch -q origin piaf && git show FETCH_HEAD:manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).run || ''))" || echo "")
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run piaf
        env:
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          PREV_RUN: ${{ steps.prev.outputs.run }}
      - name: Publier la branche piaf
        if: ${{ hashFiles('out-piaf/manifest.json') != '' }}
        run: |
          cd out-piaf
          git init -q -b piaf
          git add -A
          git -c user.name=pleutpas-data -c user.email=163107032+jlzdev@users.noreply.github.com commit -q -m "frames $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" piaf
